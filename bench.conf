MC_VERSION=${MC_VERSION:-26.3}

BUILDS=(paper purpur leaf divinemc)

JAR_paper="paper.jar"
JAR_purpur="purpur.jar"
JAR_leaf="leaf.jar"
JAR_divinemc="divinemc.jar"

RUNS=${RUNS:-5}
COOLDOWN_SECONDS=${COOLDOWN_SECONDS:-90}
BOOT_TIMEOUT=300
MAX_PLAYERS=${MAX_PLAYERS:-1000}

SIMULATION_DISTANCE=${SIMULATION_DISTANCE:-10}
VIEW_DISTANCE=${VIEW_DISTANCE:-10}

CHUNK_WORKER_THREADS=${CHUNK_WORKER_THREADS:-6}
CHUNK_IO_THREADS=${CHUNK_IO_THREADS:-4}

# taskset CPU list for the server JVM, empty means no pinning. On a multi-CCD
# chip put it on the cache-heavy CCD (scripts/cpu-layout.sh prints the line).
SERVER_CPUS=${SERVER_CPUS:-}

SEED_CHUNKGEN="4791817952625876078"
CHUNKGEN_RADIUS=2048
CHUNKGEN_XMX="8192M"
CHUNKGEN_TIMEOUT=5400

# Fake players are ServerPlayers inside the server (agent/FakePlayers.java): no client
# process, so the load is the server's own per-player work. They wander within
# PLAYERS_WANDER_RADIUS of their home at PLAYERS_SPEED blocks per tick, flying at PLAYERS_Y.
PLAYERS_SPEED=${PLAYERS_SPEED:-0.2}
PLAYERS_WANDER_RADIUS=${PLAYERS_WANDER_RADIUS:-64}
PLAYERS_Y=${PLAYERS_Y:-140}

SEED_PLAYERS="4791817952625876078"
PLAYERS_XMX="8192M"
PLAYERS_COUNT=${PLAYERS_COUNT:-60}
PLAYERS_GRID_SPACING=${PLAYERS_GRID_SPACING:-160}
PLAYERS_WORLD_RADIUS=${PLAYERS_WORLD_RADIUS:-1600}
PLAYERS_MOBS=${PLAYERS_MOBS:-1500}
SUMMON_FROM_Y=200
PLAYERS_WARMUP_SECONDS=${PLAYERS_WARMUP_SECONDS:-120}
PLAYERS_MEASURE_SECONDS=${PLAYERS_MEASURE_SECONDS:-300}

SEED_RCTCLUSTERS="4791817952625876078"
RCT_XMX="8192M"
RCT_PLAYERS=${RCT_PLAYERS:-64}
RCT_CLUSTERS=${RCT_CLUSTERS:-8}
# cluster centres sit on a circle of this radius around 0,0 (8 clusters: ~590 blocks apart)
RCT_SEPARATION=${RCT_SEPARATION:-768}
RCT_CLUSTER_RADIUS=${RCT_CLUSTER_RADIUS:-24}
RCT_MOBS_PER_CLUSTER=${RCT_MOBS_PER_CLUSTER:-500}
RCT_WARMUP_SECONDS=${RCT_WARMUP_SECONDS:-120}
RCT_MEASURE_SECONDS=${RCT_MEASURE_SECONDS:-300}
RCT_THREADS=${RCT_THREADS:-4}

SEED_RCTBLOCKS="$SEED_RCTCLUSTERS"
RCTBLOCKS_RANDOM_TICK_SPEED=${RCTBLOCKS_RANDOM_TICK_SPEED:-30}
RCTBLOCKS_ROWS=${RCTBLOCKS_ROWS:-8}
RCTBLOCKS_ROW_LENGTH=${RCTBLOCKS_ROW_LENGTH:-32}
RCTBLOCKS_Y=${RCTBLOCKS_Y:-250}

JVM_FLAGS_COMMON=(
  --add-modules=jdk.incubator.vector
  -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200
  -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch
  -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4
  -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90
  -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32
  -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1
  -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40
  -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20
  -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true
)

_bench_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
if [ -f "$_bench_dir/bench.local.conf" ]; then
  source "$_bench_dir/bench.local.conf"
fi
unset _bench_dir
