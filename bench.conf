MC_VERSION=${MC_VERSION:-26.2}

BUILDS=(paper purpur leaf divinemc)

JAR_paper="paper.jar"
JAR_purpur="purpur.jar"
JAR_leaf="leaf.jar"
JAR_divinemc="divinemc.jar"

RUNS=${RUNS:-5}
COOLDOWN_SECONDS=${COOLDOWN_SECONDS:-90}
BOOT_TIMEOUT=300
MAX_PLAYERS=${MAX_PLAYERS:-1000}

SIMULATION_DISTANCE=${SIMULATION_DISTANCE:-10}
VIEW_DISTANCE=${VIEW_DISTANCE:-10}

CHUNK_WORKER_THREADS=6
CHUNK_IO_THREADS=4

SEED_CHUNKGEN="4791817952625876078"
CHUNKGEN_RADIUS=2048
CHUNKGEN_XMX="8192M"
CHUNKGEN_TIMEOUT=5400

SEED_BOTSWARM="4791817952625876078"
BOTSWARM_XMX="8192M"
BOTSWARM_BOTS=${BOTSWARM_BOTS:-150}
BOTSWARM_GRID_SPACING=${BOTSWARM_GRID_SPACING:-160}
BOTSWARM_WORLD_RADIUS=${BOTSWARM_WORLD_RADIUS:-1600}
BOTSWARM_MOBS=${BOTSWARM_MOBS:-1500}
SUMMON_FROM_Y=200
BOTSWARM_WARMUP_SECONDS=${BOTSWARM_WARMUP_SECONDS:-120}
BOTSWARM_MEASURE_SECONDS=${BOTSWARM_MEASURE_SECONDS:-300}

SEED_RCTCLUSTERS="4791817952625876078"
RCT_XMX="8192M"
RCT_BOTS=${RCT_BOTS:-64}
RCT_CLUSTERS=${RCT_CLUSTERS:-8}
RCT_SEPARATION=${RCT_SEPARATION:-768}
RCT_MOBS_PER_CLUSTER=${RCT_MOBS_PER_CLUSTER:-500}
RCT_WARMUP_SECONDS=${RCT_WARMUP_SECONDS:-120}
RCT_MEASURE_SECONDS=${RCT_MEASURE_SECONDS:-300}
RCT_THREADS=${RCT_THREADS:-4}

BOT_TARGET=${BOT_TARGET:-127.0.0.1:25565}
BOT_HEAP=${BOT_HEAP:-6144M}
BOT_JOIN_DELAY_MIN=200
BOT_JOIN_DELAY_MAX=400
BOT_CONCURRENT_CONNECTS=8
BOT_WALK_MIN=48
BOT_WALK_MAX=160
BOT_WALK_DELAY_MIN=100
BOT_WALK_DELAY_MAX=400
BOT_JOIN_TIMEOUT=900

JVM_FLAGS_COMMON=(
  --add-modules=jdk.incubator.vector
  -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200
  -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch
  -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4
  -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90
  -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32
  -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1
  -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40
  -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20
  -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true
)

_bench_dir="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
if [ -f "$_bench_dir/bench.local.conf" ]; then
  source "$_bench_dir/bench.local.conf"
fi
unset _bench_dir
