name: TestAgent
version: 1.1.0
main: org.bxteam.testagent.TestAgent
api-version: '1.21'
load: POSTWORLD
description: Records tick durations, drives in-process fake players and runs tick scripts for server-core testing
commands:
  testagent:
    description: Test agent control
    aliases: [ta]
    usage: /ta <fake spawn|fake clear|fake status|mobs|spawns|chunks|script|mark|reset|stats|dump>
