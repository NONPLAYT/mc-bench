# Sourced last by bench.conf, so these win over its defaults. Note the flip side:
# a value pinned here also beats a command-line prefix, so comment a line out
# before sweeping that parameter, or write it as RCT_THREADS is written below.
BOTSWARM_BOTS=150
CHUNK_WORKER_THREADS=12
CHUNK_IO_THREADS=4
BOT_HEAP=12288M
RCT_THREADS=${RCT_THREADS:-8}
SERVER_PORT=25665
SERVER_IP=127.0.0.1
BOT_TARGET=127.0.0.1:25665

# Server on the cache-heavy CCD, bots on the other one (scripts/cpu-layout.sh).
# UNPINNED_SERVER=1 gives the server the whole chip, session.sh sets it for chunkgen.
[[ -n "${UNPINNED_SERVER:-}" ]] || SERVER_CPUS=0-7,16-23
BOT_CPUS=8-15,24-31
